session_name: super_odometry_slam
options:
  mouse: true
windows:
  - window_name: slam
    layout: tiled
    panes:
      - shell_command:
          - cd /home/qb/humanoid_slam/src/SuperOdom/ros2_humble_docker
          - sh container_run.sh superodom-ros2 superodom-ros2
          - docker exec --privileged -it superodom-ros2 /bin/bash
          - export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
          - source /opt/ros/humble/setup.bash
          - source ~/superodom_ws/install/setup.bash
          - cd /root/superodom_ws/src/livox_ros_driver2 
          - ./build.sh humble
          - colcon build --symlink-install
          - ros2 launch super_odometry livox_humanoid.launch.py
      - shell_command:
          - sleep 5 
          - docker exec --privileged -it superodom-ros2 /bin/bash
          - source /opt/ros/humble/setup.bash
          - source ~/superodom_ws/install/setup.bash
          - cd /root/data
          - ros2 bag play rosbag2_2025_08_13-04_28_59 --topics /livox/lidar /livox/imu 
  - window_name: visualization
    layout: tiled
    panes:
      - shell_command:
          - sleep 5
          - docker exec --privileged -it superodom-ros2 /bin/bash
          - export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
          - source /opt/ros/humble/setup.bash
          - source ~/superodom_ws/install/setup.bash
          - cd /root/superodom_ws/src/SuperOdom/super_odometry
          - export LIBGL_ALWAYS_SOFTWARE=0
          - export MESA_GL_VERSION_OVERRIDE=3.3
          - export MESA_GLSL_VERSION_OVERRIDE=330
          - export __GL_SYNC_TO_VBLANK=0
          - export __GL_THREADED_OPTIMIZATIONS=1
          - export QT_OPENGL_BUGLIST=0
          - export QT_OPENGL_NO_SANITY_CHECK=1
          - export QT_X11_NO_MITSHM=1
          - export LIBGL_ALWAYS_INDIRECT=0
          - echo " Launching optimized Docker RViz..."
          - rviz2 -d ros2.rviz
      - shell_command:
          - docker exec --privileged -it superodom-ros2 /bin/bash
          - source /opt/ros/humble/setup.bash
          - source ~/superodom_ws/install/setup.bash
          - sudo apt update
          - sudo apt install ros-humble-foxglove-bridge
          - ros2 launch foxglove_bridge foxglove_bridge_launch.xml