session_name: super_odometry_slam
options:
  mouse: true
windows:
  - window_name: slam
    layout: tiled
    panes:
      - shell_command:
          - docker exec --privileged -it superodom-ros2 /bin/bash
          - export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
          - source /opt/ros/humble/setup.bash
          - source ~/ros2_ws/install/setup.bash
          - colcon build --symlink-install
          - ros2 launch super_odometry livox_humanoid.launch.py
      - shell_command:
          - docker exec --privileged -it superodom-ros2 /bin/bash
          - source /opt/ros/humble/setup.bash
          - source ~/ros2_ws/install/setup.bash
          - cd /root/data
          - ros2 bag play rosbag2_2025_08_13-04_28_59