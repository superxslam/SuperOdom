%YAML 1.2
---
session_name: SuperOdom_ROS2

suppress_history: false

windows:
    - window_name: superodom_ros2
      focus: false
      layout: main-vertical
      panes:
          - shell_command:
                - source /opt/ros/humble/setup.bash
                - source install/setup.bash 
                - cd ~/shibo_intern_ws
                - ros2 launch super_odometry livox_humanoid.launch.py 
          - shell_command:
                - cd ~/shibo_intern_ws
                - source install/setup.bash 
                - source /opt/ros/humble/setup.bash
                - sleep 3
                - ros2 bag record --storage mcap \
                 -o colorized_map \
                 /zed/zed_node/right/image_rect_color/uncompressed \
                 /laser_odometry_aligned \
                 /state_estimation_aligned \
                 /state_estimation \
                 /laser_odometry \
                 /tf \
                 /registered_scan_colorized
          - shell_command:
                - cd ~/dataset
                - source /opt/ros/humble/setup.bash
                - source install/setup.bash 
                - sleep 3
                - ros2 bag play humanoid_long_traj --topics /livox/lidar /livox/imu 

    - window_name: rviz
      focus: false
      layout: main-horizontal
      panes:
          - shell_command:
                - cd ~/shibo_intern_ws
                - source install/setup.bash 
                - source /opt/ros/humble/setup.bash
                - sleep 3
                - unset LIBGL_ALWAYS_SOFTWARE
                - unset LIBGL_ALWAYS_INDIRECT
                - unset MESA_LOADER_DRIVER_OVERRIDE
                - unset MESA_GL_VERSION_OVERRIDE
                - unset MESA_GLSL_VERSION_OVERRIDE
                - export QT_X11_NO_MITSHM=1
                - DRI_PRIME=1 __NV_PRIME_RENDER_OFFLOAD=1 __GLX_VENDOR_LIBRARY_NAME=nvidia rviz2 -d ros2.rviz
