%YAML 1.2
---
# =========================================
# SuperOdometry Launch Configuration
# =========================================
# IMPORTANT: Modify the paths below before running!
#
# Usage: tmuxp load humanoid.yaml
# =========================================

session_name: SuperOdom_ROS2

# =========================================
# USER CONFIGURATION - MODIFY THESE PATHS
# =========================================
environment:
    # Path to your ROS2 workspace (where you built SuperOdom)
    SUPERODOM_WS: ~/superodom_ws

    # Path to your dataset directory
    DATASET_DIR: ~/humanoid_dataset/12-05-dancing1

    # Rosbag names (without .db3 extension)
    BAG_LIVOX: imu_foundation_bag_20251205_145009_livox
    BAG_OTHER: imu_foundation_bag_20251205_145009_other

suppress_history: false

windows:
    - window_name: superodom_ros2
      focus: false
      layout: main-vertical
      panes:
          # Pane 1: Launch SuperOdometry
          - shell_command:
                - source /opt/ros/humble/setup.bash
                - source ${SUPERODOM_WS}/install/setup.bash
                - cd ${SUPERODOM_WS}
                - ros2 param set /use_sim_time true
                - ros2 launch super_odometry humanoid_colorization.launch.py

          # Pane 2: Play rosbag dataset
          - shell_command:
                - source /opt/ros/humble/setup.bash
                - source ${SUPERODOM_WS}/install/setup.bash
                - cd ${DATASET_DIR}
                - sleep 5
                - ${SUPERODOM_WS}/src/SuperOdom/script/play_humanoid_bags.sh ${BAG_LIVOX} ${BAG_OTHER}

          # Pane 3: Optional visualization launch
          - shell_command:
                - source /opt/ros/humble/setup.bash
                - source ${SUPERODOM_WS}/install/setup.bash
                - cd ${SUPERODOM_WS}
                - sleep 8
                # Uncomment to launch visualization:
                # - ros2 launch super_odometry humanoid_visualization.launch.py use_sim_time:=true

    - window_name: rviz
      focus: false
      layout: main-horizontal
      panes:
      #   - shell_command:
      #           - cd ~/unitree_g1_rviz
      #           - source /opt/ros/humble/setup.bash
      #           - source ~/unitree_g1_rviz/install/setup.bash
      #           - source ~/shibo_intern_ws/install/setup.bash
      #           - ros2 param set /use_sim_time true
      #           - sleep 2
      #           - ros2 launch g1_package g1_robot.launch.xml
        - shell_command:
                - cd ~/shibo_intern_ws
                - source /opt/ros/humble/setup.bash
                - source ~/shibo_intern_ws/install/setup.bash
            #    - source ~/unitree_g1_rviz/install/setup.bash
                - sleep 5
                - unset LIBGL_ALWAYS_SOFTWARE
                - unset LIBGL_ALWAYS_INDIRECT
                - unset MESA_LOADER_DRIVER_OVERRIDE
                - unset MESA_GL_VERSION_OVERRIDE
                - unset MESA_GLSL_VERSION_OVERRIDE
                - export QT_X11_NO_MITSHM=1
                - DRI_PRIME=1 __NV_PRIME_RENDER_OFFLOAD=1 __GLX_VENDOR_LIBRARY_NAME=nvidia rviz2 -d ~/shibo_intern_ws/src/SuperOdom/super_odometry/ros2.rviz
