%YAML 1.2
---
session_name: SuperOdom_ROS2

suppress_history: false

windows:
    - window_name: superodom_ros2
      focus: false
      layout: main-vertical
      panes:
          - shell_command:
                - source /opt/ros/humble/setup.bash
                - cd ~/shibo_intern_ws
                - source install/setup.bash 
                - ros2 launch super_odometry livox_humanoid.launch.py 
          - shell_command:
                - cd ~/dataset/20251012/calibration
                - source /opt/ros/humble/setup.bash
                - source install/setup.bash 
                - source ~/shibo_intern_ws/install/setup.bash
                - sleep 3
                - ros2 bag play navigation_bag_20251012_235052_livox 
          - shell_command:
                - cd ~/shibo_intern_ws
                - source /opt/ros/humble/setup.bash
                - source install/setup.bash 
                - source ~/shibo_intern_ws/install/setup.bash
                - export PATH="/usr/bin:$PATH"
                - python3 ~/shibo_intern_ws/src/SuperOdom/script/save_odometry_csv.py --output-dir ~/dataset/20251012/calibration/


    - window_name: rviz
      focus: false
      layout: main-horizontal
      panes:
          - shell_command:
                - cd ~/shibo_intern_ws/src/SuperOdom/super_odometry
                - source install/setup.bash 
                - source /opt/ros/humble/setup.bash
                - sleep 3
                - unset LIBGL_ALWAYS_SOFTWARE
                - unset LIBGL_ALWAYS_INDIRECT
                - unset MESA_LOADER_DRIVER_OVERRIDE
                - unset MESA_GL_VERSION_OVERRIDE
                - unset MESA_GLSL_VERSION_OVERRIDE
                - export QT_X11_NO_MITSHM=1
                - DRI_PRIME=1 __NV_PRIME_RENDER_OFFLOAD=1 __GLX_VENDOR_LIBRARY_NAME=nvidia rviz2 -d ros2.rviz

