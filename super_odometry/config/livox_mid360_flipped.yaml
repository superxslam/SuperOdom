/**:
  ros__parameters:
    imu_topic: "/livox/imu_flipped"
    laser_topic: "/livox/lidar_flipped"
    odom_topic: "/state_estimation"
    sensor: "livox"
    use_imu_roll_pitch: false

    world_frame: "map"
    world_frame_rot: "map_rot"
    sensor_frame: "sensor"
    sensor_frame_rot: "sensor_rot"

    imu_acc_x_limit: 0.5
    imu_acc_y_limit: 0.2
    imu_acc_z_limit: 0.4

    # Feature Extraction Params
    feature_extraction_node:
        scan_line: 4 
        min_range: 0.5    # Increased to reduce point density
        filter_point_size: 5  # Reduced for better performance

    # Laser Mapping Params
    laser_mapping_node:
        mapping_line_resolution: 0.2        # Reduced for better precision
        mapping_plane_resolution: 0.3       # Reduced for better precision
        max_iterations: 4                   # Reduced for faster processing
        max_surface_features: 2000          # Increased for better features
        velocity_failure_threshold: 30.0    # Added motion threshold
      

        # For localization mode
        localization_mode: false
        read_pose_file: false
        init_x: 0.0
        init_y: 0.0
        init_z: 0.0
        init_roll: 0.0
        init_pitch: 0.0
        init_yaw: 0.0 

    # IMU Preintegration Params
    imu_preintegration_node:
        lidar_correction_noise: 0.1        # Increased for more tolerance
        
        acc_n: 0.05        # Increased accelerometer measurement noise
        gyr_n: 0.02        # Increased gyroscope measurement noise
        acc_w: 0.001       # Increased accelerometer bias noise
        gyr_w: 0.001       # Increased gyroscope bias noise
        g_norm: 9.80511    # 0 means you need to provide both imu-camera and laser-camera extrinsic
